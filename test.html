<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Test</title>
		<style>
			body {
				margin: 2rem;
				font-family: sans-serif;
				color: #222;
			}

			header {
				display: flex;
				justify-content: space-between;
				align-items: center;
			}

			h1 {
				margin-bottom: 1rem;
			}

			h2 {
				margin: 0;
			}

			.container {
				max-width: 1000px;
				margin: 0 auto;
			}

			#testSummaryStatus {
				font-size: 2em;
				font-weight: bold;
			}

			#results {
				display: grid;
				grid-template-columns: 1fr;
				gap: 1rem;
			}

			details.test-suite-summary {
				border: 1px solid #ccc;
				padding: 0.75rem 1rem;

				summary {
					display: flex;
					align-items: center;
					gap: 0.5rem;
					cursor: pointer;

					h2 {
						margin: 0;
					}
				}

				&[open] summary {
					margin-bottom: 1rem;
				}
			}

			table {
				border-collapse: collapse;
				width: 100%;
				table-layout: auto;
				margin-top: 1rem;

				th {
					text-align: left;
					font-weight: 600;
				}

				th, td {
					border: 1px solid #ccc;
					padding: 0.5rem 0.75rem;
					vertical-align: top;
				}
			}

			.passed {
				color: #2e7d32; /* Darker, more readable green */
			}

			.failed {
				color: #c62828; /* Darker, more readable red */
			}
		</style>
	</head>
	<body>
		<div class="container">
			<header>
				<h1>Test Summary Report</h1>
				<span id="testSummaryStatus"></span>
			</header>
			<main>
				<section id="results"></section>
			</main>
		</div>

		<script type="module">
			import {runTestSuites} from './src/test/testRunner';
			import {renderTestResults} from './src/test/renderer';

			// The tests are self-registering.
			import './src/components/pantry-checkin-dialog.test';
			import './src/components/pantry-product-dialog.test';

			const results = runTestSuites();
			renderTestResults(results);
		</script>
	</body>
</html>
